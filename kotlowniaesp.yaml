esphome:
  name: kotlowniaesp
  friendly_name: KotlowniaESP

esp8266:
  board: nodemcuv2  # Changed from esp01_1m to nodemcuv2 for NodeMCU v3

# Enable logging
logger:
  level: DEBUG  # Set to INFO in production

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Kotlowniaesp Fallback Hotspot"
    password: !secret fallback_password

captive_portal:

# One-Wire bus for Dallas temperature sensors
one_wire:
  - platform: gpio
    pin: GPIO2  # D4 on NodeMCU (pin 4 in your original config)

# Sensors
sensor:
  # Your existing Dallas temperature sensors
  - platform: dallas_temp
    address: 0x380000006b786628
    name: "CWU1 UP Temperature"
    id: temp_cwu1_up
    update_interval: 15s

  - platform: dallas_temp
    address: 0xa9182ed446d05528
    name: "Temperature 2"
    id: temp2
    update_interval: 15s

  - platform: dallas_temp
    address: 0xde489ed4466af528
    name: "Temperature 3"
    id: temp3
    update_interval: 15s

  - platform: dallas_temp
    address: 0xd01861d446f36d28
    name: "Temperature 4"
    id: temp4
    update_interval: 15s

  - platform: dallas_temp
    address: 0x670088d446329b28
    name: "Temperature 5"
    id: temp5
    update_interval: 15s

  # Import Shelly H&T temperatures from Home Assistant (one per zone)
  # All currently point to the same sensor - update entity_id when you add more Shelly devices

  - platform: homeassistant
    name: "Zone 1 Shelly Temperature"
    id: shelly_temperature_zone1
    entity_id: sensor.termometr_jarek_temperature  # Update this when you have Zone 1 Shelly
    filters:
      - heartbeat: 60s
    on_value:
      then:
        - lambda: |-
            ESP_LOGD("shelly_zone1", "Zone 1 Temperature received: %.1f°C", x);

  - platform: homeassistant
    name: "Zone 2 Shelly Temperature"
    id: shelly_temperature_zone2
    entity_id: sensor.termometr_jarek_temperature  # Update this when you have Zone 2 Shelly
    filters:
      - heartbeat: 60s
    on_value:
      then:
        - lambda: |-
            ESP_LOGD("shelly_zone2", "Zone 2 Temperature received: %.1f°C", x);

  - platform: homeassistant
    name: "Zone 3 Shelly Temperature"
    id: shelly_temperature_zone3
    entity_id: sensor.termometr_jarek_temperature  # Update this when you have Zone 3 Shelly
    filters:
      - heartbeat: 60s
    on_value:
      then:
        - lambda: |-
            ESP_LOGD("shelly_zone3", "Zone 3 Temperature received: %.1f°C", x);

  - platform: homeassistant
    name: "Zone 4 Shelly Temperature"
    id: shelly_temperature_zone4
    entity_id: sensor.termometr_jarek_temperature  # Update this when you have Zone 4 Shelly
    filters:
      - heartbeat: 60s
    on_value:
      then:
        - lambda: |-
            ESP_LOGD("shelly_zone4", "Zone 4 Temperature received: %.1f°C", x);

# GPIO Outputs for heating control (4 zones)
switch:
  # Zone 1 - Heating Output
  - platform: gpio
    pin: GPIO5  # D1 on NodeMCU
    name: "Zone 1 Heating Output"
    id: heating_output_zone1
    icon: "mdi:radiator"
    restore_mode: RESTORE_DEFAULT_OFF

  # Zone 2 - Heating Output
  - platform: gpio
    pin: GPIO14  # D5 on NodeMCU
    name: "Zone 2 Heating Output"
    id: heating_output_zone2
    icon: "mdi:radiator"
    restore_mode: RESTORE_DEFAULT_OFF

  # Zone 3 - Heating Output
  - platform: gpio
    pin: GPIO12  # D6 on NodeMCU
    name: "Zone 3 Heating Output"
    id: heating_output_zone3
    icon: "mdi:radiator"
    restore_mode: RESTORE_DEFAULT_OFF

  # Zone 4 - Heating Output
  - platform: gpio
    pin: GPIO13  # D7 on NodeMCU
    name: "Zone 4 Heating Output"
    id: heating_output_zone4
    icon: "mdi:radiator"
    restore_mode: RESTORE_DEFAULT_OFF

# Binary sensors to show heating status for each zone
binary_sensor:
  - platform: template
    name: "Zone 1 Heating Active"
    id: heating_active_zone1
    device_class: heat
    lambda: |-
      return id(heating_output_zone1).state;

  - platform: template
    name: "Zone 2 Heating Active"
    id: heating_active_zone2
    device_class: heat
    lambda: |-
      return id(heating_output_zone2).state;

  - platform: template
    name: "Zone 3 Heating Active"
    id: heating_active_zone3
    device_class: heat
    lambda: |-
      return id(heating_output_zone3).state;

  - platform: template
    name: "Zone 4 Heating Active"
    id: heating_active_zone4
    device_class: heat
    lambda: |-
      return id(heating_output_zone4).state;

# Climate control (4 independent thermostats)
climate:
  # Zone 1 Thermostat
  - platform: thermostat
    name: "Zone 1 Thermostat"
    id: thermostat_zone1
    sensor: shelly_temperature_zone1  # Uses Zone 1 Shelly sensor

    visual:
      min_temperature: 10 °C
      max_temperature: 30 °C
      temperature_step: 0.5 °C

    default_preset: Home
    preset:
      - name: Home
        default_target_temperature_low: 20 °C
        mode: heat
      - name: Away
        default_target_temperature_low: 16 °C
        mode: heat
      - name: Sleep
        default_target_temperature_low: 18 °C
        mode: heat

    heat_deadband: 1.0 °C
    heat_overrun: 0.0 °C

    heat_action:
      - switch.turn_on: heating_output_zone1
    idle_action:
      - switch.turn_off: heating_output_zone1

    startup_delay: true
    min_heating_off_time: 120s
    min_heating_run_time: 120s
    min_idle_time: 30s

  # Zone 2 Thermostat
  - platform: thermostat
    name: "Zone 2 Thermostat"
    id: thermostat_zone2
    sensor: shelly_temperature_zone2  # Uses Zone 2 Shelly sensor

    visual:
      min_temperature: 10 °C
      max_temperature: 30 °C
      temperature_step: 0.5 °C

    default_preset: Home
    preset:
      - name: Home
        default_target_temperature_low: 20 °C
        mode: heat
      - name: Away
        default_target_temperature_low: 16 °C
        mode: heat
      - name: Sleep
        default_target_temperature_low: 18 °C
        mode: heat

    heat_deadband: 1.0 °C
    heat_overrun: 0.0 °C

    heat_action:
      - switch.turn_on: heating_output_zone2
    idle_action:
      - switch.turn_off: heating_output_zone2

    startup_delay: true
    min_heating_off_time: 120s
    min_heating_run_time: 120s
    min_idle_time: 30s

  # Zone 3 Thermostat
  - platform: thermostat
    name: "Zone 3 Thermostat"
    id: thermostat_zone3
    sensor: shelly_temperature_zone3  # Uses Zone 3 Shelly sensor

    visual:
      min_temperature: 10 °C
      max_temperature: 30 °C
      temperature_step: 0.5 °C

    default_preset: Home
    preset:
      - name: Home
        default_target_temperature_low: 20 °C
        mode: heat
      - name: Away
        default_target_temperature_low: 16 °C
        mode: heat
      - name: Sleep
        default_target_temperature_low: 18 °C
        mode: heat

    heat_deadband: 1.0 °C
    heat_overrun: 0.0 °C

    heat_action:
      - switch.turn_on: heating_output_zone3
    idle_action:
      - switch.turn_off: heating_output_zone3

    startup_delay: true
    min_heating_off_time: 120s
    min_heating_run_time: 120s
    min_idle_time: 30s

  # Zone 4 Thermostat
  - platform: thermostat
    name: "Zone 4 Thermostat"
    id: thermostat_zone4
    sensor: shelly_temperature_zone4  # Uses Zone 4 Shelly sensor

    visual:
      min_temperature: 10 °C
      max_temperature: 30 °C
      temperature_step: 0.5 °C

    default_preset: Home
    preset:
      - name: Home
        default_target_temperature_low: 20 °C
        mode: heat
      - name: Away
        default_target_temperature_low: 16 °C
        mode: heat
      - name: Sleep
        default_target_temperature_low: 18 °C
        mode: heat

    heat_deadband: 1.0 °C
    heat_overrun: 0.0 °C

    heat_action:
      - switch.turn_on: heating_output_zone4
    idle_action:
      - switch.turn_off: heating_output_zone4

    startup_delay: true
    min_heating_off_time: 120s
    min_heating_run_time: 120s
    min_idle_time: 30s

# Status LED (optional - uses built-in LED)
status_led:
  pin:
    number: GPIO16  # D0 on NodeMCU (built-in LED)
    inverted: true
